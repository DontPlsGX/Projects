name: Deploy quiz to GitHub Pages

# Chuyển quiz/source/*.docx thành câu hỏi rồi đưa thư mục quiz/ lên nhánh gh-pages
# (GitHub Pages đang phục vụ từ nhánh gh-pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx==1.2.0
      - name: Chuyển .docx thành câu hỏi
        run: python tools/docx_to_quiz.py
      - name: Đưa website lên nhánh gh-pages
        run: |
          rm -rf quiz/source
          touch quiz/.nojekyll
          cd quiz
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
